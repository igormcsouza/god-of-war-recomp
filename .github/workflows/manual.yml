# Builds the English manual (mkdocs.yml, manual/) and publishes it to GitHub Pages on pushes to main.
name: Manual

on:
  push:
    branches: [main]
    paths: [manual/**, mkdocs.yml, .github/workflows/manual.yml]
  pull_request:
    paths: [manual/**, mkdocs.yml, .github/workflows/manual.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs-material==9.5.50
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: {path: site}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
