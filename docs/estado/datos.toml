# Datos del mapa de estado (docs/estado/mapa.*.svg y docs/estado/detalle.*.md).
# Tras editar este archivo, regenera con:  python tools/estado/generar.py
# (La accion de GitHub "Mapa de estado" lo hace sola al subir cambios a main.)
#
# Estados: "ok" (funciona), "parcial" (funciona con fallos o sin verificar), "pendiente" (no funciona / no emulado).
#
# Plataformas: `estado` y `nota` son la linea base (el mapa de Windows, heredado de upstream, no se mantiene
# aqui y no se modifica). El mapa de Linux (el que mantenemos) parte de lo mismo y solo cambia donde hay
# evidencia propia: `linux = "<estado>"` y/o `nota_linux = {...}` en el elemento, o `solo = "linux"` en un
# componente de hardware que no existe en Windows. El estado de Linux no sube sin evidencia en docs/ESTADO.md,
# docs/PROGRESS_LOG.md, docs/VULKAN.md, docs/LINUX_LAUNCHER.md o docs/CONTROLES.md.

