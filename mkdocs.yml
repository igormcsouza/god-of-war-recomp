site_name: God of War Recomp (Linux)
site_description: Native Linux port of God of War (PS2) by static recompilation - install, use, how it works and how it evolved.
site_url: https://igormcsouza.github.io/god-of-war-recomp/
repo_url: https://github.com/igormcsouza/god-of-war-recomp
repo_name: igormcsouza/god-of-war-recomp
docs_dir: manual
edit_uri: edit/main/manual/
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - scheme: slate
      primary: red
      accent: red
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Install:
      - AppImage (recommended): install/appimage.md
      - From source: install/from-source.md
  - Use:
      - Launcher: usage/launcher.md
      - Controls: usage/controls.md
      - Environment variables: usage/env-vars.md
      - Screenshots: usage/screenshots.md
  - Project:
      - How it evolved: project/evolution.md
      - Performance: project/performance.md
      - Architecture: project/architecture.md
      - Status: project/status.md
      - Credits and legal: project/credits.md
      - Contributing: project/contributing.md
  - Reference:
      - Research log: reference/research-log.md
      - Architecture details: reference/architecture-details.md
      - Scripted pad and diagnostics: reference/controls-and-menu-tests.md
      - Movies and audio: reference/movies-and-audio.md
      - Memory card: reference/memory-card.md
      - Linux launcher details: reference/linux-launcher-details.md
      - Linux build details: reference/linux-build-details.md
      - Linux ISO: reference/linux-iso.md
      - Status map: status-map/detail.en.md
