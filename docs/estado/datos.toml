# y llega hasta el inicio de la siguiente (el enlazador las coloca seguidas). Los inicios salen de las
# funciones con nombre de config/recomp.template.toml. Varias entradas con el mismo `nombre` se juntan.
# ---------------------------------------------------------------------------------------------------------
