# Regenerates the status map (manual/status-map/) when its data changes and pushes the result.
name: Status map

on:
  push:
    branches: [main]
    paths:
      - manual/status-map/data.toml
      - config/funcmap.csv
      - tools/status/**
      - .github/workflows/status.yml
  pull_request:
    paths:
      - manual/status-map/**
      - config/funcmap.csv
      - tools/status/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # En una PR solo se avisa si los archivos generados no estan al dia
      - name: Comprobar
        if: github.event_name == 'pull_request'
        run: python tools/status/generate.py --comprobar

      - name: Generar y subir
        if: github.event_name != 'pull_request'
        run: |
          python tools/status/generate.py
          if [ -n "$(git status --porcelain manual/status-map)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manual/status-map
            git commit -m "Actualizar el mapa de estado"
            git push
          fi
